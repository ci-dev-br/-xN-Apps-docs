<div class="page--wrapper">
    <div class="wrapper">
        @if(!feeds || feeds.length === 0){
        }@else {
        <div class="feed" #feedContainer>
            @for(feed of feeds; track $index) {
            <div class="feed-item">
                <!--  <h3>{{feed.author}} <span class="date">{{feed.date | date:'short'}}</span></h3> -->
                @if(feed.title){<h4 [innerHtml]="feed.title"></h4>}
                <div [innerHtml]="feed.content" class="feed-content"></div>
                <div style="text-align:right"><a target="_blank"
                        [href]="'https://' + feed?.sourceInfo?.domain">{{feed?.sourceInfo?.name}}</a>
                </div>
                <div class="interactions">
                    <button mat-icon-button color="primary"
                        (click)="interacao(feed, 'liked')"><mat-icon>thumb_up</mat-icon></button>
                    <button mat-icon-button color="primary"
                        (click)="interacao(feed, 'open')"><mat-icon>open_in_new</mat-icon></button>
                </div>
                <div>{{feed.categoria}}</div>
            </div>
            }
        </div>}
        <div class="apps">
            @for (item of apps; track $index) {
            <mat-card (click)="appClickHandler($event, item)">
                {{item.name}}
            </mat-card>
            }
        </div>
    </div>
</div>
