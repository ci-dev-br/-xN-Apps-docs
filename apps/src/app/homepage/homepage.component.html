<ci-navbar></ci-navbar>
<div class="page--wrapper" [style.background-image]="`url(${bg})`">
    <header class="container">
        <img class="logo" src="logo-colorida.svg"
            alt="maraca do 'apps.ci.dev.br' escrita em manuscrito e colida degradê em caixa baixa">
    </header>
    <!-- 
        Visualização quando autenticado
    
    -->
    <div class="container"><!-- [class.apps]="!!(userService.user |async)" -->
        @if(!!(userService.user |async)){

        <div class="apps">
            @for (item of apps; track $index) {

            <mat-card>
                {{item.name}}
            </mat-card>
            }
        </div>
        }
    </div>


</div>
<footer>
    <div class="assinatura">
        Desenvolvido por <a href="https://ci.dev.br" target="_blank">ci.dev.br</a>, 2025
    </div>
    <a href="/termos-de-uso">Termos de Uso e Privacidade</a>
</footer>
