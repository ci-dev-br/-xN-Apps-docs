<ci-navbar></ci-navbar>
<div class="page--wrapper">
    @if(userService && !!(userService.user | async)){
    <div #sidebarElement class="sidebar" [class.--inactive]="!sidebar"
        (click)="sidebar=!sidebar;$event.preventDefault()" [style.top]="sidebarTop + 'px' "
        [style.left]="sidebarLeft + 'px'">
        <div class="row">
            <button mat-raised-button (click)="newPost()">
                Texto
            </button>
            <button mat-raised-button (click)="newCitation()">
                Citação
            </button>
            <button mat-raised-button (click)="newPhoto()">
                Foto
            </button>
            <button mat-raised-button (click)="newVideo()">
                Vídeo
            </button>
        </div>
        <span style="flex:auto"></span>
        <div class="row end">
            <button mat-icon-button color="primary" routerLink="/meus-apps"><mat-icon>apps</mat-icon></button>
            <button mat-icon-button (click)="openSidebarSettings()"><mat-icon>settings</mat-icon></button>
        </div>
        <mat-icon class="icon">draw</mat-icon>
    </div>
    <div class="wrapper">
        <div>
            <p>
                Nada por perto até o momento,
            </p>
            <p>
                seja o publicar algo por perto!
            </p>
        </div>
        <div class="apps">
            @for (item of apps; track $index) {
            <mat-card (click)="appClickHandler($event, item)">
                {{item.name}}
            </mat-card>
            }
        </div>
    </div>
    }@else {
    <header class="container">
        <figure>
            <img class="logo" src="logo-colorida.svg"
                alt-label="Logo 'apps.ci.dev.br' escrita em manuscrito e colida degradê em minúsculo">
        </figure>

        <mat-form-field>
            <mat-label>Pesquisar ...</mat-label>
            <input type="text" matInput placeholder="Pesquisar...">
        </mat-form-field>
    </header>
    }
</div>
<x-footer />
