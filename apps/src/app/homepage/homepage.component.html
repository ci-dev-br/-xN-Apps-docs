        <button mat-raised-button color="primary" routerLink="/meus-apps">Meus Apps</button>
        @if(categorias){@for (item of categorias; track $index) {
        <button mat-button>{{item.name}}</button>
        }}
        <div class="row">
            <button mat-raised-button>
                Publicar Texto
            </button>
            <button mat-raised-button>
                Publicar Foto
            </button>

                Publicar Vídeo
            </button>
        </div>
        <span style="flex:auto"></span>
        <div class="row end">
            <button mat-icon-button (click)="openSidebarSettings()"><mat-icon>settings</mat-icon></button>
        </div>
    </div>
    <div class="wrapper">

            <p>

            </p>

                seja o publicar algo por perto!
            </p>
