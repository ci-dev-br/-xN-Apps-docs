<mat-form-field>
    <mat-label>Pesquisar Apps, configurações e cadastros.</mat-label>
    <input #searchInputElement (keydown.escape)="searchControl.reset()" matInput [formControl]="searchControl"
        type="text" placeholder="Pesquisar Apps, configurações e cadastros.">
</mat-form-field>
<div class="container">
    <h5>Todos os Apps</h5>
</div>
<div class="apps container --flexible">
    @for (app of (appsFiltered || apps); track $index) {
    <div class="app" [tabindex]="$index" (contextmenu)="contextMenuHanlder($event)"
        (keydown.enter)="appClickHandler($event, app)" (click)="appClickHandler($event, app)"
        [attr.aria-labelledby]="app!.description">
        <!-- [matTooltip]="app.description" -->
        <div class="bg" [style.border-color]="app.color"></div>
        <span class="header">
            @if(app.icon){
            @if(app.type === 'svg' && !!app.icon){
            <mat-icon [svgIcon]="app.icon" [inline]="true"></mat-icon>
            }@else{
            <mat-icon [inline]="true">{{app.icon}}</mat-icon>
            }
            }
            <span class="label">
                {{app.name}}
            </span>
        </span>
        @if(!!app?.shortDescription){
        <span class="description">
            {{app.shortDescription}}
        </span>
        }
    </div>
    }
    <div class="app">
        <span class="header">
            <span class="label">
                Adicionar Aplicativos
            </span>
            <button mat-icon-button>
                <mat-icon [inline]="true">add</mat-icon>
            </button>
        </span>
    </div>
</div>
