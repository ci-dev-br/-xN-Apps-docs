<mat-toolbar color="accent">
    <ci-logo></ci-logo>
    <span style="flex: auto;"></span>
    <button mat-button routerLink="meus-apps" routerLinkActive="ativo">
        Meus Apps
    </button>
    <button mat-button routerLink="/prancheta" routerLinkActive="ativo">
        Dashboard
    </button>
    <button mat-button routerLink="/blog" routerLinkActive="ativo">
        Blog
    </button>
    <mat-form-field appearance="outline" #pesquisaField>
        <mat-label>Pesquisar...</mat-label>
        <input type="text" matInput placeholder="Pesquisar...">
        <button matSuffix mat-icon-button>
            <mat-icon>clean</mat-icon>
        </button>
        <button matSuffix mat-icon-button>
            <mat-icon>search</mat-icon>
        </button>
    </mat-form-field>

    <span style="flex: auto;"></span>
    <button mat-icon-button (click)="repo()">
        <ci-icon mode="svg" icon="github"></ci-icon>
    </button>
    <button mat-button [matMenuTriggerFor]="userMenu">
        {{(user | async)?.username}}
    </button>
    <mat-menu #userMenu>
        <button mat-menu-item (click)="sair()">
            <mat-icon>exit_to_app</mat-icon>
            Sair
        </button>
    </mat-menu>
</mat-toolbar>
<mat-drawer-container class="container">
    @if(!!apps){<mat-drawer mode="side" opened auto-scroll="vertical" tabindex="0">
        @for (app of apps; track $index) {
        <button mat-icon-button class="app" [matTooltip]="app.name" [matTooltipPosition]="'right'" routerLinkActive="side-ativo"
            [routerLink]="'/' + app.url" (click)="appClickHandler($event, app)">
            @if(app.icon){
            @if(app.type === 'svg'){
            <mat-icon [svgIcon]="app.icon"></mat-icon>
            }
            @else{
            <mat-icon>{{app.icon}}</mat-icon>
            }
            }
            <div class="title">{{app.name}}</div>
        </button>
        }
    </mat-drawer>}
    <mat-drawer-content>
        <router-outlet></router-outlet>
    </mat-drawer-content>
</mat-drawer-container>
