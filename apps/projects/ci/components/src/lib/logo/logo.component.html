@if (isExternalLink(link)) {
    <a [href]="link" class="logo-link" title="CI Apps">
        <img src="/logo-colorida.svg" alt="CI Apps Logo" class="logo-img" />
    </a>
} @else {
    <a [routerLink]="link || '/'" class="logo-link" title="CI Apps">
        <img src="/logo-colorida.svg" alt="CI Apps Logo" class="logo-img" />
    </a>
}
