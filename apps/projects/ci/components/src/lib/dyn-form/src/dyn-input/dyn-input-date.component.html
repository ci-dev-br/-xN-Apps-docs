<mat-form-field appearance="outline" class="ci-dyn-form-field">
    <mat-label>{{label || placeholder || fieldName || ''}}</mat-label>
    <input
        matInput
        [type]="htmlInputType"
        [placeholder]="placeholder || label || ''"
        [value]="formattedControlValue"
        (input)="onDateInputChange($any($event.target).value)"
        (change)="onDateInputChange($any($event.target).value)">
    @if(!!description || !!hint){
    <mat-hint>{{description || hint}}</mat-hint>
    }
</mat-form-field>
