<mat-toolbar [auto-scroll]="'horizontal'">
    <button mat-raised-button (click)="createNew()">
        Novo
    </button>
    <!-- <mat-form-field>
        <mat-label>Filtrar por Papel</mat-label>
        <mat-select [(ngModel)]="filtrarPapel">
            <mat-option value="all">Todos os Papéis</mat-option>
        </mat-select>
    </mat-form-field> -->
    <ng-content selector="toolbar"></ng-content>
    <span style="flex:auto"></span>
    <mat-button-toggle-group [(ngModel)]="visualizacao">
        <mat-button-toggle value="table"><mat-icon>view_list</mat-icon>Tabela</mat-button-toggle>
        <mat-button-toggle value="list"><mat-icon>grid_view</mat-icon>Lista</mat-button-toggle>
    </mat-button-toggle-group>
</mat-toolbar>
@if(list){
@if(visualizacao==='list'){
<!-- <ci-data-list [source]="list" [templateItem]="itemListTemplate"></ci-data-list> -->
<ng-template #itemListTemplate let-item="item">
    <div class="list-item-content" [class.--active]="!!item.active">
        @if(!!item.title){<h6>{{item.title}}</h6>}
        @if(!!item.description){<small>{{item.description}}</small>}
        <div class="actions">
        </div>
    </div>
</ng-template>
}
@else{
<ci-data-grid [options]="gridOptions" (select)="editar($event.value, $event.event)" [source]="list">
    <div vazio>Não há dados...</div>
</ci-data-grid>
}
}
@else{
<div class="vazio">Não há dados...</div>
}
