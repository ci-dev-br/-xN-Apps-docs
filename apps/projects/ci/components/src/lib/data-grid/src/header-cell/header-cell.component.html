<ng-container *ngIf="column">
    <div class="row">
        @if(!!column.headerName || !!column.fieldName){ <span class="text-content">{{column.headerName ||
            column.fieldName}} </span> }
        @if(sort === 'ASC'){
        <button mat-icon-button>
            <mat-icon>arrow_upward</mat-icon>
        </button>
        }
        @else if(sort === 'DESC'){
        <button mat-icon-button>
            <mat-icon>arrow_downward</mat-icon>
        </button>
        }
    </div>
</ng-container>
