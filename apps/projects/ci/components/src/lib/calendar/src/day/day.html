<div class="day-view-wrapper">
    <div class="day-header">
        <h3>{{ selectedDate | date: 'fullDate' }}</h3>
    </div>
    <div class="scroll-container">
        <div class="time-grid">
            <div *ngIf="isToday" class="current-time-marker" [style.top.px]="markerTopPosition">
                <div class="time-bubble">{{ currentTime | date : 'HH:mm:ss' }}</div>
                <div class="line"></div>
            </div>
            <div class="hour-row" *ngFor="let hour of hours" [style.height.px]="HOUR_HEIGHT">
                <div class="time-label">
                    <span>{{ hour | number:'2.0' }}:00</span>
                </div>
                <div class="time-slot">
                </div>
            </div>
        </div>
    </div>
</div>
