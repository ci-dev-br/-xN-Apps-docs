<header class="calendar-header">
    <div class="month-title">
        <h2>{{currentViewDate | date: 'MMMM' }} <span>{{ currentViewDate | date: 'yyyy' }}</span></h2>
    </div>
    <div class="nav-buttons">
        <button mat-stroked-button (click)="viewMode='day'">Dia</button>
        <button mat-stroked-button (click)="viewMode='month'">Mês</button>
        <button mat-stroked-button (click)="viewMode='year'">Ano</button>
        <button mat-stroked-button (click)="prevMonth()" aria-label="Mês anterior">
            <mat-icon>arrow_left</mat-icon>
        </button>
        <button mat-stroked-button (click)="goToToday()">Hoje</button>
        <button mat-stroked-button (click)="nextMonth()" aria-label="Próximo mês">
            <mat-icon>arrow_right</mat-icon>
        </button>
    </div>
</header>
