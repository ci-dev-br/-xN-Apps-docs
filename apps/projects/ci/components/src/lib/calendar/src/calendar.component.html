<div class="calendar-container">
    <ci-calendar-header (prevMonth)="prevMonth()" (goToToday)="goToToday()" (prevMonth)="prevMonth()"
        (nextMonth)="nextMonth()" [currentViewDate]="currentViewDate" (viewModeOutput)="viewMode=$event"
        [viewMode]="viewMode" [weekDays]="weekDays" [days]="days" [current]="current"
        [selectedDate]="selectedDate"></ci-calendar-header>
    @if(viewMode==='day'){
    <ci-day></ci-day>
    }
    @else if(viewMode==='month'){
    <div class="weekdays-grid">
        <span *ngFor="let dayName of weekDays" class="weekday">
            {{ dayName }}
        </span>
    </div>
    <div class="days-grid">
        <div class="day-cell" *ngFor="let day of days" [class.is-other-month]="!day.isCurrentMonth"
            [class.is-today]="day.isToday" [class.is-selected]="day.isSelected" (click)="selectDate(day)">
            <div class="day-header">
                <span class="day-number">{{ day.dayNumber }}</span>
            </div>
            <div class="day-content">
                <span *ngIf="day.hasEvents" class="event-dot"></span>
            </div>
        </div>
    </div>
    }
    @else if(viewMode==='year'){
    <ci-calendar-year [currentYear]="selectedDate"></ci-calendar-year>
    }
</div>
