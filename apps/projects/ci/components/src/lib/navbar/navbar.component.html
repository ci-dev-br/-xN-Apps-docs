@if(!!(user | async)){
<mat-toolbar color="accent">
    <ci-logo></ci-logo>
    @if(menuItens){@for (item of menuItens; track $index) {
    <button mat-button [routerLink]="item.routerLink" routerLinkActive="ativo">
        {{item.label}}
    </button>
    }
    }
    <mat-form-field appearance="outline" #pesquisaField>
        <mat-label>Pesquisar...</mat-label>
        <input type="text" matInput placeholder="Pesquisar...">
        <button matSuffix mat-icon-button>
            <mat-icon>clear</mat-icon>
        </button>
        <button matSuffix mat-icon-button>
            <mat-icon>search</mat-icon>
        </button>
    </mat-form-field>
    <button mat-button [matMenuTriggerFor]="userMenu">
        {{(user | async)?.username}}
    </button>
    <mat-menu #userMenu>
        <button mat-menu-item (click)="sair()">
            <mat-icon>exit_to_app</mat-icon>
            Sair
        </button>
    </mat-menu>
</mat-toolbar>
}
@if(!!!((user | async)?.username)){<nav>
    <ul>
        <li>
            <a routerLink="registrar">Registrar</a>
        </li>
        <li>
            <a routerLink="acessar">Entrar</a>
        </li>
    </ul>
</nav>}
