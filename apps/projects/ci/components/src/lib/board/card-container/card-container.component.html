<div class="card-wrapper" [class.editing]="board.edittingCard === card">
    <!-- cdkDrag -->
    @if(componentRef){<div class="inner">
        <ng-container *ngComponentOutlet="componentRef"></ng-container>
    </div>}
    <div class="card-verso">
        <div class="wrapper">
            <ci-settings></ci-settings>

        </div>
    </div>
    <div class="actions">
        @if(board.edittingCard === card){
        <button mat-icon-button (click)="removeCard(card!,$event)" [matTooltip]="'Remover cartão'">
            <mat-icon>delete</mat-icon>
        </button>
        <button mat-icon-button (click)="editCard(card!,$event)">
            <mat-icon>done_all</mat-icon>
        </button>
        }@else{
        <button mat-icon-button (click)="editCard(card!,$event)">
            <mat-icon>settings</mat-icon>
        </button>
        }
    </div>
</div>
