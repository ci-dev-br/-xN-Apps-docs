<div>
    <mat-form-field>
        <input matInput #pesquisaInput type="text" placeholder="Pesquisar" (keydown.enter)="find(pesquisaInput.value)">
    </mat-form-field>
</div>
<div class="cards">
    @for (card of lista; track $index) {
    <div class="card-preview">
        <div>
            @if(!!card.title){<h3>{{card.title}}</h3>}
            @if(!!card.descricao){<p>{{card.descricao}}</p>}
        </div>
        <button mat-raised-button (click)="adicionar(card)">Adicionar Card </button>
    </div>
    }
</div>
