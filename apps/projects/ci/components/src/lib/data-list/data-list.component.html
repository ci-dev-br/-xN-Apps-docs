<div class="list">
    @if(!!source && source.length > 0){
    @for (item of source; track $index) {
    <div class="item" tabindex="1" (click)="rowSelectionHandler($event, item)"
        [class.--selected-item]="selectedItem === item">
        @if(!!templateItem){
        <ng-container *ngTemplateOutlet="templateItem; context: {item : item}"></ng-container>
        }
    </div>
    }
    }@else {
    Nenhum item na lista
    }
</div>
