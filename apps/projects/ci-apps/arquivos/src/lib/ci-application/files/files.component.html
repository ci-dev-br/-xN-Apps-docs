<mat-tab-group>
    <mat-tab label="Minha Imagens">
        <mat-toolbar>
            <button mat-icon-button>
                <mat-icon>arrow_back</mat-icon>
            </button>
            <button mat-icon-button>
                <mat-icon>arrow_forward</mat-icon>
            </button>
            <button mat-icon-button (click)="voltar()">
                <mat-icon>arrow_upward</mat-icon>
            </button>
            <input type="text" class="navegacao" #urlInput [(ngModel)]="endereco"
                (keydown.enter)="ir(urlInput.value)" />
        </mat-toolbar>
        <div class="scoller">
            <h4>Pastas</h4>
            <div class="folders">
                @for (file of files; track $index) {
                <div class="folder-wrapper">
                    <div class="folder" (click)="file.info ? ir(file.info.path + '/' + file.name) : null">
                        <mat-icon>{{file.icon}}</mat-icon>
                    </div>
                    <div class="title">
                        {{file.name}}
                    </div>
                </div>
                }
            </div>
        </div>
    </mat-tab>
</mat-tab-group>
