<mat-tab-group>
    <mat-tab label="Minha Imagens">
        <mat-toolbar>
            <button mat-icon-button (click)="back()" >
                <mat-icon>arrow_back</mat-icon>
            </button>
            <button mat-icon-button>
                <mat-icon>arrow_forward</mat-icon>
            </button>
            <button mat-icon-button (click)="voltar()">
                <mat-icon>arrow_upward</mat-icon>
            </button>
            <button mat-icon-button >
                <mat-icon>edit</mat-icon>
            </button>
            <input type="text" class="navegacao" #urlInput [(ngModel)]="endereco"
                (keydown.enter)="ir(urlInput.value)" [matAutocomplete]="historicoAuto" />
            <mat-autocomplete #historicoAuto="matAutocomplete">
                @if(historico){@for (hist of historico; track hist) {<mat-option [value]="hist">{{hist}}</mat-option>}}
            </mat-autocomplete>
            <input type="text" class="navegacao" [(ngModel)]="filtrar" />
        </mat-toolbar>
        <div class="scoller">
            <h4>Pastas</h4>
            <div class="folders">
                @for (file of filteredFiles || files; track $index) {
                <div [tabIndex]="$index + 1" class="folder" (click)="abrir(file)">
                    <div class="folder-wrapper">
                        @if(file.iconType=== 'svg' && !!file.icon){<mat-icon [svgIcon]="file.icon"></mat-icon>}
                        @else{ <mat-icon>{{file.icon}}</mat-icon> }
                        <div class="title">
                            {{file.name}}
                        </div>
                    </div>
                </div>
                }
            </div>
        </div>
    </mat-tab>
</mat-tab-group>
