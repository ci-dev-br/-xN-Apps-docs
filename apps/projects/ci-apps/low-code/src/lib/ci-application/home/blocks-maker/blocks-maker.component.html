<mat-toolbar>
    <button mat-raised-button color="primary" [matMenuTriggerFor]="novoMenu">
        <mat-icon>add</mat-icon>
        Novo
    </button>
    <mat-menu #novoMenu>
        <button mat-menu-item>
            Bloco de Construção
        </button>
        <button mat-menu-item>
            Bloco de Teste
        </button>
        <button mat-menu-item>
            Bloco de Automação
        </button>
    </mat-menu>
    <button mat-button>
        <mat-icon>import</mat-icon>
        Importar bloco
    </button>
</mat-toolbar>
<section>
    <h3>Criador de blocos de construção</h3>
    <p>Os blocos de construção permitem construir as partes do seu sistema de forma transparente para as regras de
        negócio.
    </p>
    <div class="blocos">
        @if(blocos){@for (item of blocos; track $index) {}}
        @else {
        <small>
            Nenhum bloco cadastrado
        </small>
        }
    </div>
</section>
