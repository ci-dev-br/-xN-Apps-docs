<mat-drawer-container class="container">
    <mat-drawer [mode]="!(isSmallScreen | async)?.matches ? 'side' : 'over'" [opened]="menus.opened | async"
        auto-scroll="vertical">
        <div class="menu">
            <ng-container *ngFor="let item of menu">
                <button mat-menu-item (click)="abrirItemMenu(item.path ||'')">
                    <mat-icon>{{item.icon || 'article'}}</mat-icon>{{item.title}}
                </button>
            </ng-container>
        </div>
    </mat-drawer>
    <mat-drawer-content>
        <div class="container">
            <router-outlet></router-outlet>
        </div>
        <nav class="status">
            Barra
        <!-- TODO: barra de status -->
        </nav>
    </mat-drawer-content>
</mat-drawer-container>
