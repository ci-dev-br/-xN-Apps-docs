<mat-drawer-container class="container">
    <mat-drawer [mode]="!(isSmallScreen | async)?.matches ? 'side' : 'over'" [opened]="menus.opened | async"
        auto-scroll="vertical">
        <div class="menu">
            <ng-container *ngFor="let item of menu">
                <button mat-menu-item [class.active-menu-item]="activeEntity === item.path"
                    (click)="abrirItemMenu(item.path ||'')">
                    <mat-icon>{{item.icon || 'article'}}</mat-icon>{{item.title | nomenclatura}}
                </button>
            </ng-container>
        </div>
    </mat-drawer>
    <mat-drawer-content>
        <div class="container">
            <router-outlet></router-outlet>
            <nav class="status">
                @if(activeEntity){
                <span>Entidade ativa: <strong>{{activeEntity | nomenclatura}}</strong></span>
                }@else{
                <span>Cadastros</span>
                }
            </nav>
        </div>
    </mat-drawer-content>
</mat-drawer-container>
