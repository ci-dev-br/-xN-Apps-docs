<div class="row">
    @if(formulario){
    <div class="col small-container auto">
        @if(!!formGroup){<mat-card>
            <mat-card-content [formGroup]="formGroup">
                <ci-input mode="content-editable" label="Título" fieldName="title" el="h1" />
                <ci-input mode="content-editable" label="Descrição" fieldName="description" />
            </mat-card-content>
        </mat-card>}
        @if(!!((formulario)?.perguntas?.perguntas)){
        @for (pergunta of formulario.perguntas!.perguntas; track pergunta) {
        <mat-card>
            <mat-card-content>
                <!-- <ci-pergunta-item [source]="pergunta"></ci-pergunta-item> -->
            </mat-card-content>
            <mat-card-footer align="end">
                <button mat-icon-button (click)="removerPergunta(pergunta)">
                    <mat-icon>delete</mat-icon>
                </button>
            </mat-card-footer>
        </mat-card>
        }
        }
        <mat-card>
            <mat-card-footer align="end">
                <button mat-raised-button color="primary" (click)="confirm()">Aplicar ajustes</button>
            </mat-card-footer>
        </mat-card>
    </div>
    }
    <div class="container-menu">
        <div class="menu">
            <h6>Ações</h6>
            <button mat-icon-button matTooltip="Adicionar pergunta" matTooltipPosition="left"
                (click)="adicionarPergunta()">
                <mat-icon>add</mat-icon>
            </button>
            <button mat-icon-button [matMenuTriggerFor]="shareMenu">
                <mat-icon>share</mat-icon>
            </button>
            <mat-menu #shareMenu>
                <button mat-menu-item (click)="compartilhar()">
                    Compartilhar para Editar
                </button>

                <button mat-menu-item (click)="compartilhar()">
                    Publicar fomulário (criar link)
                </button>
            </mat-menu>
        </div>
    </div>
</div>
<h4>
    <ci-logo></ci-logo> Formulários
</h4>
