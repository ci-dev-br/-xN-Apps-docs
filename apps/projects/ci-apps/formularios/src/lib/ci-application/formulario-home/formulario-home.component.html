<mat-toolbar>
    <h4>Formulários recentes</h4>
    <form [formGroup]="filtro" style="display: contents;">
        <mat-form-field>
            <input matInput type="text" placeholder="Filtrar" formControlName="filtro">
        </mat-form-field>
    </form>
</mat-toolbar>
<div class="files">
    @for (form of (formsFiltrered || forms); track $index) {
    <ci-file [title]="form.title || 'Formulário sem título'" [description]=" form.description || undefined"
        icon="list_alt" (click)="form.internalId ? openFormById(form.internalId) : null">
        <ci-action menu icon="edit" label="Renomear"></ci-action>
        <ci-action menu icon="delete" label="Excluir" (click)="remove(form?.internalId || '')"></ci-action>
    </ci-file>
    }
</div>
<div class="float-menu">
    <button mat-fab [matTooltip]="'Criar formulário'" [matTooltipPosition]="'left'" (click)="criarFormulario()">
        <mat-icon>add</mat-icon>
    </button>
</div>
<router-outlet></router-outlet>
