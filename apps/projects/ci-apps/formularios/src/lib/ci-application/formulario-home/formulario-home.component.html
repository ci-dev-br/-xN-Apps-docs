<mat-toolbar>
    <!-- <h4>Recentes</h4> -->
    <span style="flex: auto;"></span>
    <form [formGroup]="filtro" style="display: contents;">
        <mat-form-field>
            <mat-label>Filtrar por palavra</mat-label>
            <input matInput type="text" placeholder="Filtrar por palavra-chave" formControlName="filtro">
            <button matSuffix mat-icon-button (click)="filtro.reset()"><mat-icon>clear</mat-icon></button>
        </mat-form-field>
    </form>
    <button mat-icon-button [matMenuTriggerFor]="settingsMenu"><mat-icon>more_vert</mat-icon></button>
    <mat-menu #settingsMenu>
        <button mat-menu-item>
            Configurar visualização
        </button>
    </mat-menu>
</mat-toolbar>
<div class="files">
    @for (form of (formsFiltrered || forms); track $index) {
    <ci-file [title]="form.title || 'Formulário sem título'" [description]=" form.description || undefined"
        icon="list_alt" (click)="form.internalId ? openFormById(form.internalId) : null">
        <ci-action menu icon="edit" label="Renomear"></ci-action>
        <ci-action menu icon="delete" label="Excluir" (click)="remove(form?.internalId || '')"></ci-action>
    </ci-file>
    }
</div>
<div class="float-menu">
    <button mat-fab [matTooltip]="'Criar formulário'" [matTooltipPosition]="'left'" (click)="criarFormulario()">
        <mat-icon>add</mat-icon>
    </button>
</div>
<router-outlet></router-outlet>
