<nav mat-tab-nav-bar [tabPanel]="tabPanel">
    @if(tabs){
    @for (tab of tabs; track tab) {
    <a mat-tab-link [routerLink]="tab.path">
        @if(tab.icon){<mat-icon>
            {{tab.icon}}
        </mat-icon>}
        {{tab.label}}</a>
    }
    }
</nav>
<mat-tab-nav-panel #tabPanel>
    <div class="wrapper">
        <router-outlet></router-outlet>
    </div>
</mat-tab-nav-panel>
<ci-status-bar></ci-status-bar>
