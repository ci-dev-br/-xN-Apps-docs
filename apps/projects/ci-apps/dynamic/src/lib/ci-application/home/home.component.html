<section class="recentes-bar" *ngIf="filteredBlocks.length > 0">
    <div class="recentes-title">
        <h4>Telas / Blocos Salvos</h4>
        <span class="count">{{ filteredBlocks.length }}</span>
    </div>

    <div class="recentes-list">
        <div
            *ngFor="let block of filteredBlocks"
            class="block-pill"
            [class.active]="activeBlock?.internalId === block.internalId"
            (click)="selecionarBloco(block)">
            <mat-icon>layers</mat-icon>
            <div class="pill-info">
                <strong>{{ block.name || 'Sem nome' }}</strong>
                <span>{{ block.route || '/sem-rota' }}</span>
            </div>
            <button mat-icon-button color="warn" (click)="excluirBloco(block, $event)" matTooltip="Excluir tela">
                <mat-icon>close</mat-icon>
            </button>
        </div>
    </div>
</section>

<main class="builder-workspace">
    <ci-blocks-builder
        [availableComponents]="availableComponents"
        [(value)]="currentSpec"
        (saveRequested)="salvarBloco($event)">
    </ci-blocks-builder>
</main>
