@if(stage==='menu'){
<div class="menu">
    <button mat-raised-button color="primary" (click)="start()">
        Nova Partida!
    </button>
    <button mat-raised-button color="accent" (click)="startVsIA()">
        Jogar vs IA
    </button>
    <button mat-button>
        Procurar oponente...
    </button>
</div>
}
@else if(stage==='play'){
<div class="chess-container" #rendererContainer>
    <!-- View 3D -->
    @if(renderMode === '3d'){
    <c-threjs #th [objetos]="objetos" [camera]="camera" (objectClicked)="handle3DClick($event)"></c-threjs>
    }

    <!-- View 2D -->
    @if(renderMode === '2d'){
    <div class="board">
        <div *ngFor="let row of board; let i = index" class="row">
            <div *ngFor="let cell of row; let j = index" class="square" [ngClass]="(i + j) % 2 === 0 ? 'light' : 'dark'"
                [class.selected]="selectedSquare === getCoords(i, j)" (click)="onSquareClick(i, j)">
                <span *ngIf="cell" class="piece" [ngClass]="cell.color">
                    {{ getPieceSymbol(cell) }}
                </span>
            </div>
        </div>
    </div>
    }

    <span *ngIf="isVsIA && game.turn() === 'b'">(IA pensando...)</span>

    <div class="row legeng">
        <div class="status">
            Vez do jogador: {{ game.turn() === 'w' ? 'Brancas' : 'Pretas' }}
        </div>
        <span style="flex: auto;"></span>
        <button mat-icon-button [matMenuTriggerFor]="optionsMenu">
            <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #optionsMenu>
            <button mat-menu-item (click)="toggleRenderMode()">
                Mudar para Visão {{ renderMode === '3d' ? '2D' : '3D' }}
            </button>
            <button mat-menu-item (click)="ajudaMe()">
                Ajuda
            </button>
            <button mat-menu-item (click)="desistir()">
                Desistir
            </button>
        </mat-menu>
    </div>
</div>
}
