<mat-toolbar>
    <button mat-icon-button (click)="sideMenu.toggle()">
        <mat-icon>menu</mat-icon>
    </button>
</mat-toolbar>
<mat-drawer-container>
    <mat-drawer #sideMenu mode="over" opened>
        @for(entitie of entidades; track $index){
        <button mat-menu-item [routerLink]="'./' + entitie">
            <mat-icon>dashboard</mat-icon>{{entitie | nomenclatura}}</button>
        }
    </mat-drawer>
    <mat-drawer-content>
        <div class="container">
            <router-outlet></router-outlet>
        </div>
    </mat-drawer-content>
</mat-drawer-container>
