<h2>Crie, gerencie e ministre cursos e treinamentos. Prepare aulas e monte turmas de estudos. Completamente
    personalizável.</h2>

<div class="cards">
    @if(actions){@for (action of actions; track $index) {
    <div class="card" (click)="action.onClick ? action.onClick(undefined) : undefined">
        @if(action.label){{{action.label}}}
    </div>
    }}
</div>
