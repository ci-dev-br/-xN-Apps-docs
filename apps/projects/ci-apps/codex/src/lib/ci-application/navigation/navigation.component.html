<!-- Menu Bar -->
<div class="bar">
    <button mat-button [matMenuTriggerFor]="fileMenu">
        File
    </button>
    <!-- <button mat-button>
        Edit
    </button> -->
    <mat-menu #fileMenu>
        <!-- <button mat-menu-item (click)="files.openCreateNew()">
            New
        </button> -->
        <!-- <button mat-menu-item (click)="openProject()">
            Open Project...
        </button> -->
        <button mat-menu-item (click)="openFile()">
            Open File...
        </button>
    </mat-menu>
    @if(!!arquivos){
    <button mat-button [matMenuTriggerFor]="arquivosMenu">
        Opened files
    </button>
    <mat-menu #arquivosMenu>
        @for(arq of arquivos; track arq){
        @if(!!arq){<button mat-menu-item (click)="open(arq)">
            {{arq.name}}
        </button>}                      
        }
    </mat-menu>
    }
    <span style="flex: auto"></span>
</div>
<nav mat-tab-nav-bar [tabPanel]="tabPanel">
    @if(abas){
    @for (aba of abas; track aba) {
    <a mat-tab-link [routerLink]="'./' + aba.path">
        @if(aba.icon){<mat-icon>
            {{aba.icon}}
        </mat-icon>}
        {{aba.label}}</a>
    }
    }
</nav>
<mat-tab-nav-panel #tabPanel>
    <router-outlet></router-outlet>
</mat-tab-nav-panel>
