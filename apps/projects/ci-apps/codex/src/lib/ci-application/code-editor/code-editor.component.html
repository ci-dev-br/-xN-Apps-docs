<div class="container" [class.fullscreen]="fullscreen">
    @if(!carregando){
    <div style="display:flex; flex-direction: row;">
        <button mat-icon-button (click)="fullscreen = !fullscreen">
            <mat-icon>fullscreen</mat-icon>
        </button>
        <span style="flex:auto"></span>

        <!-- <button mat-button>
        Voltar ultima versão
    </button> -->
    </div>
    <ci-breadcrumb [oppenedFile]="oppenedFile"></ci-breadcrumb>
    <div class="wrapper">
        <!-- inner here -->
        <ng-container *ngTemplateOutlet="inner"></ng-container>
    </div>
    }@else{
    <div class="loading">
        Carregando arquivo...
    </div>
    }
    <div class="status">
        <button>develop</button><!-- todo: controle de versão -->
    </div>
    <ng-template #inner>
        <nu-monaco-editor [(ngModel)]="value" [options]="editorOptions" height="calc(100vh - 154px)"></nu-monaco-editor>
    </ng-template>
</div>
<mat-form-field>
    <input #desc matInput placeholder="Descrição das modificações" />
    <button matSuffix mat-button [disabled]="!desc.value" (click)="confirmar()">
        Confirmar
    </button>
</mat-form-field>
